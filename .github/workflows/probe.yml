name: probe

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths: ['sites.json', 'probe.py', '.github/workflows/probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run probe and write snapshots
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 probe.py --notify

      - name: Commit snapshots (data is the dashboard)
        run: |
          git config user.name "cert-sentry bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no snapshot change"
          else
            git commit -m "chore: probe snapshot $(date -u +%F-%H%M)"
            git push
          fi
